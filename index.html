<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>まちマニアMAP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="日本じゅうのお店が建っていく、みんなで歩ける3Dマップ。">
<meta name="theme-color" content="#cfe8f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="まちマニア">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Mochiy+Pop+One&display=swap">
<style>
/* 画面全体がゲーム。UIは「シール」のような厚みのあるパネルで、昼の明るい世界に合わせて一つの見た目に固定 */
:root {
  --ink: #3b3427;          /* 文字・ふち */
  --ink-soft: #7a6f5c;
  --paper: #fffdf7;        /* パネル */
  --paper-2: #f4efe2;
  --leaf: #3fae6a;         /* 決定・オンライン */
  --leaf-deep: #2d8a51;
  --sun: #ffcf4a;          /* 強調 */
  --coral: #ef6f5a;        /* 注意・通報 */
  --sky: #bfe4f2;
  --shadow: rgba(59, 52, 39, 0.28);
  --font-ui: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
  --font-logo: "Mochiy Pop One", "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif;
  --r: 18px;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: #cfe8f3; color: var(--ink);
  font-family: var(--font-ui); font-size: 14px; -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none; touch-action: none;
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

.panel {
  background: var(--paper); border: 3px solid var(--ink); border-radius: var(--r);
  box-shadow: 0 5px 0 var(--shadow);
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 0 16px; border: 3px solid var(--ink); border-radius: 999px;
  background: var(--paper); font-weight: 800; box-shadow: 0 3px 0 var(--shadow);
  transition: transform .08s ease, box-shadow .08s ease; white-space: nowrap; text-decoration: none;
}
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--shadow); }
.btn.primary { background: var(--leaf); color: #fff; }
.btn.sun { background: var(--sun); }
.btn.danger { background: var(--coral); color: #fff; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.icon-btn { width: 46px; height: 46px; padding: 0; font-size: 20px; border-radius: 14px; flex-direction: column; gap: 0; }
.icon-btn small { font-size: 9px; font-weight: 800; line-height: 1; margin-top: 1px; }
.icon-btn.wide { width: auto; min-width: 46px; padding: 0 6px; }

/* ---------------- HUD */
.hud-tl {
  position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 8px; align-items: flex-start; pointer-events: none; z-index: 5;
}
.logo {
  font-family: var(--font-logo); font-size: 26px; line-height: 1; padding: 8px 14px 9px;
  letter-spacing: .04em; pointer-events: auto;
}
.logo span { color: var(--leaf); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px;
  background: var(--paper); border: 2.5px solid var(--ink); font-weight: 800; font-size: 12.5px;
  box-shadow: 0 3px 0 var(--shadow); pointer-events: auto;
}
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-soft); }
.chip.on .dot { background: var(--leaf); box-shadow: 0 0 0 3px rgba(63,174,106,.25); }
.chip.test .dot { background: var(--sun); }

.hud-tr {
  position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 8px; align-items: flex-end; z-index: 5;
}
.map-wrap { position: relative; padding: 5px; border-radius: 16px; transition: width .2s, height .2s; }
#minimap { display: block; width: 210px; height: 140px; border-radius: 11px; background: #e8eeec; cursor: crosshair; }
.map-wrap.big #minimap { width: min(640px, 86vw); height: min(440px, 58vh); }
.map-toggle {
  position: absolute; right: 10px; bottom: 10px; border: 2px solid var(--ink); background: var(--paper);
  border-radius: 9px; font-size: 11px; font-weight: 800; padding: 2px 8px;
}
.map-hint { position: absolute; left: 12px; bottom: 10px; font-size: 10.5px; font-weight: 700; color: var(--ink-soft); background: rgba(255,253,247,.85); padding: 1px 6px; border-radius: 6px; }
.tools { display: flex; gap: 8px; }

/* ---------------- チャット */
.chatbar {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: min(560px, calc(100vw - 24px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
  display: flex; flex-direction: column; gap: 8px; z-index: 6;
}
.chat-log {
  max-height: min(34vh, 300px); overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px;
  font-size: 13.5px; overscroll-behavior: contain; touch-action: pan-y;
}
.chat-log[hidden] { display: none !important; }
.msg { display: flex; gap: 6px; align-items: baseline; line-height: 1.5; min-width: 0; }
.msg .who { font-weight: 800; white-space: nowrap; border: 0; background: none; padding: 0; cursor: pointer; color: var(--leaf-deep); }
.msg.mine .who { color: var(--ink); }
.msg .body { overflow-wrap: anywhere; min-width: 0; }
.msg .stamp { font-size: 22px; line-height: 1; }
.msg .time { margin-left: auto; color: var(--ink-soft); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.msg.system { color: var(--ink-soft); font-size: 12px; justify-content: center; }
.chat-row { display: flex; gap: 6px; align-items: center; padding: 6px; border-radius: 999px; }
.chat-row input {
  flex: 1; min-width: 0; height: 40px; border: 0; background: var(--paper-2); border-radius: 999px; padding: 0 14px;
  font-size: 15px; outline: none;
}
.chat-row input:focus { box-shadow: inset 0 0 0 2.5px var(--leaf); }
.chat-row .icon-btn { width: 40px; height: 40px; border-radius: 50%; font-size: 18px; flex: none; }
#btnLog { position: relative; }
#btnLog[data-unread]::after {
  content: attr(data-unread); position: absolute; top: -7px; right: -7px; min-width: 18px; height: 18px; padding: 0 4px;
  border-radius: 999px; background: var(--coral); color: #fff; border: 2px solid var(--ink); font-size: 10px; line-height: 14px;
}
.count { font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; }
.stamps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 8px; }
.stamps[hidden] { display: none !important; }
.stamp-btn {
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border-radius: 14px;
  border: 2.5px solid var(--ink); background: var(--paper); font-size: 24px; box-shadow: 0 3px 0 var(--shadow);
}
.stamp-btn span { font-size: 11px; font-weight: 800; }

/* ---------------- 吹き出し */
#bubbles { position: fixed; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
.bubble {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); max-width: 220px;
  background: #fff; border: 2.5px solid var(--ink); border-radius: 16px; padding: 6px 11px;
  font-weight: 700; font-size: 13.5px; line-height: 1.45; box-shadow: 0 3px 0 var(--shadow);
  overflow-wrap: anywhere; animation: pop .22s ease-out;
}
.bubble::after {
  content: ""; position: absolute; left: 50%; bottom: -9px; width: 12px; height: 12px; background: #fff;
  border-right: 2.5px solid var(--ink); border-bottom: 2.5px solid var(--ink); transform: translateX(-50%) rotate(45deg);
}
.bubble.stamp { font-size: 30px; padding: 4px 10px; line-height: 1.1; text-align: center; }
.bubble.stamp small { display: block; font-size: 11px; }
@keyframes pop { from { transform: translate(-50%, -80%) scale(.6); opacity: 0; } }

/* ---------------- お店カード */
.shop-card {
  position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  width: min(330px, calc(100vw - 24px)); overflow: hidden; z-index: 7; animation: rise .25s ease-out;
}
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
.shop-thumb {
  position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: linear-gradient(135deg, var(--ring, #ef6f5a), #ffcf4a);
  display: grid; place-items: center; border-bottom: 3px solid var(--ink); overflow: hidden;
}
.shop-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.shop-thumb .emoji { font-size: 56px; filter: drop-shadow(0 3px 0 rgba(0,0,0,.15)); }
.shop-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
.shop-body h3 { margin: 0; font-size: 18px; line-height: 1.3; text-wrap: balance; }
.shop-meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; font-weight: 800; }
.tag { padding: 2px 9px; border-radius: 999px; background: var(--paper-2); border: 2px solid var(--ink); }
.shop-body p { margin: 0; line-height: 1.6; font-size: 13.5px; color: #4d4535; }
.shop-actions { display: flex; gap: 8px; }
.shop-actions .btn { flex: 1; }
.yt { background: #ff4b3e; color: #fff; }
.close-x {
  position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 50%; border: 2.5px solid var(--ink);
  background: var(--paper); font-weight: 800; z-index: 2; display: grid; place-items: center; padding: 0;
}

/* ---------------- モーダル */
.modal-bg {
  position: fixed; inset: 0; background: rgba(40, 36, 28, .38); z-index: 20; display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.modal { position: relative; width: min(560px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow-y: auto; padding: 20px; touch-action: pan-y; }
.modal h2 { margin: 0 0 4px; font-family: var(--font-logo); font-weight: 400; font-size: 22px; letter-spacing: .02em; }
.modal .lead { margin: 0 0 14px; color: var(--ink-soft); line-height: 1.6; }
.modal section + section { margin-top: 14px; }
.modal h4 { margin: 0 0 6px; font-size: 12px; letter-spacing: .08em; color: var(--ink-soft); }
.row-end { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field input[type=text], .field input[type=email], .field input[type=url], .field textarea {
  border: 2.5px solid var(--ink); border-radius: 12px; padding: 9px 12px; background: #fff; font-size: 15px; min-width: 0;
}
.field textarea { resize: vertical; min-height: 70px; }
.note { font-size: 12px; color: var(--ink-soft); line-height: 1.6; }

.editor { display: grid; grid-template-columns: 200px 1fr; gap: 16px; align-items: start; }
.preview { width: 100%; aspect-ratio: 3 / 4; max-width: 100%; border-radius: 16px; background: radial-gradient(circle at 50% 70%, #f6efd9, #dff0f6); border: 2.5px solid var(--ink); display: block; }
.face-photo { display: flex; flex-direction: column; gap: 4px; padding: 10px; border-radius: 12px; background: color-mix(in srgb, var(--sun, #ffd166) 22%, transparent); }
.face-photo small { opacity: .75; }
.official-opt { padding: 8px 10px; border-radius: 12px; background: rgba(255,226,120,.45); display: flex; flex-direction: column; gap: 2px; }
.official-opt small { opacity: .75; }
.opts { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.sw {
  width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid var(--ink); padding: 0; box-shadow: 0 2px 0 var(--shadow);
}
.sw[aria-pressed=true] { outline: 3px solid var(--sun); outline-offset: 2px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 2.5px solid var(--ink); background: var(--paper); border-radius: 999px; padding: 4px 11px; font-weight: 800; font-size: 12.5px; }
.seg button[aria-pressed=true] { background: var(--sun); }
input[type=range] { width: 100%; accent-color: var(--leaf); }

.shop-list { display: flex; flex-direction: column; gap: 8px; }
.shop-item { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border: 2.5px solid var(--ink); border-radius: 14px; background: #fff; }
.shop-item .em { font-size: 26px; text-align: center; }
.shop-item b { display: block; font-size: 14.5px; }
.shop-item small { color: var(--ink-soft); font-weight: 700; font-variant-numeric: tabular-nums; }
.shop-item .acts { display: flex; gap: 6px; }
.shop-item .btn { min-height: 34px; padding: 0 12px; font-size: 12.5px; }
.empty { padding: 18px; text-align: center; color: var(--ink-soft); border: 2.5px dashed var(--ink-soft); border-radius: 14px; }

.radio-list { display: flex; flex-direction: column; gap: 6px; }
.radio-list label { display: flex; gap: 8px; align-items: center; font-weight: 700; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; }
kbd { display: inline-block; border: 2px solid var(--ink); border-bottom-width: 4px; border-radius: 8px; padding: 1px 7px; font-weight: 800; font-family: var(--font-ui); background: #fff; font-size: 12px; }
.credits { font-size: 12px; line-height: 1.7; color: var(--ink-soft); }
.credits a { color: var(--leaf-deep); }

/* ---------------- その他 */
#toast {
  position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  z-index: 30; padding: 9px 16px; font-weight: 800; max-width: calc(100vw - 32px); text-align: center;
}
#joystick {
  position: fixed; left: max(18px, env(safe-area-inset-left, 0px)); bottom: calc(92px + env(safe-area-inset-bottom, 0px));
  width: 116px; height: 116px; border-radius: 50%; background: rgba(255,253,247,.55); border: 3px solid rgba(59,52,39,.45);
  z-index: 6; touch-action: none;
}
#joystick .knob { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--shadow); }
#loading {
  position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: #e8eeec;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
}
#loading .box { text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
#loading .big { font-family: var(--font-logo); font-size: 44px; }
#loading .big span { color: var(--leaf); }
#loading .bar { width: 220px; height: 14px; border: 3px solid var(--ink); border-radius: 999px; overflow: hidden; background: var(--paper); }
#loading .bar i { display: block; height: 100%; width: 5%; background: var(--leaf); transition: width .2s; }
#loading p { margin: 0; font-weight: 700; color: var(--ink-soft); }
.compass { position: absolute; left: 10px; top: 9px; font-size: 10px; font-weight: 800; background: var(--paper); border: 2px solid var(--ink); border-radius: 8px; padding: 0 5px; }

@media (max-width: 640px) {
  .logo { font-size: 20px; padding: 6px 11px 7px; }
  #minimap { width: 132px; height: 92px; }
  .map-hint { display: none; }
  .icon-btn { width: 40px; height: 40px; font-size: 17px; }
  .icon-btn.wide { width: 40px; padding: 0; font-size: 15px; }
  .icon-btn.wide small { font-size: 7.5px; line-height: 1.05; }
  .tools { flex-direction: column; }
  .editor { grid-template-columns: 1fr; }
  .preview { width: 150px; justify-self: center; }
  .hud-tl { max-width: calc(100vw - 190px); }
  .news { width: calc(100vw - 190px); }
  .news-list { max-height: 236px; }
  .news-item { grid-template-columns: 1fr auto; padding: 6px; }
  .news-item .em { display: none; }
  .chip { font-size: 11.5px; padding: 3px 9px; }
  .shop-card { left: 50%; right: auto; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); animation: none; }
  .shop-thumb { aspect-ratio: 4 / 1; }
  .shop-thumb .emoji { font-size: 34px; }
  .shop-body { padding: 10px 12px 12px; gap: 6px; }
  .shop-body h3 { font-size: 16px; padding-right: 30px; }
  .shop-body p { font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .shop-actions .btn { min-height: 38px; }
  .close-x { width: 28px; height: 28px; }
}

/* ---------------- まちマニアMAP 追加 */
.news { width: min(310px, calc(100vw - 24px)); padding: 0; overflow: hidden; pointer-events: auto; border-radius: 16px; }
.news-head { all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; font-weight: 800; font-size: 13.5px; }
.news-head:focus-visible { outline: 3px solid var(--sun); outline-offset: -3px; }
.news-head span { flex: 1; }
.news-head .chev { font-style: normal; transition: transform .2s; }
.news-head[aria-expanded="false"] .chev { transform: rotate(-90deg); }
.news-badge { background: var(--coral, #ef6b5b); color: #fff; border-radius: 999px; font-size: 11px; padding: 1px 7px; }
.news-list { list-style: none; margin: 0; padding: 0 8px 8px; max-height: 292px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; overscroll-behavior: contain; }
.news-list[hidden] { display: none !important; }
.news-item { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; padding: 7px 8px; border-radius: 12px; background: rgba(255,255,255,.75); border: 2px solid rgba(59,52,39,.12); min-height: 50px; }
.news-item .em { font-size: 20px; text-align: center; }
.news-item .t { min-width: 0; }
.news-item .t b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.news-item .t small { display: block; font-size: 11px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.news-item .new { display: inline-block; font-size: 9.5px; font-weight: 900; background: var(--coral, #ef6b5b); color: #fff; border-radius: 6px; padding: 0 5px; margin-right: 4px; vertical-align: 1px; }
.news-item .go { padding: 5px 9px; font-size: 12px; min-height: 0; }
.news-empty { font-size: 12px; color: var(--ink-soft); padding: 4px 6px 8px; }
.logo small { font-family: var(--font-ui); font-weight: 800; font-size: 12px; margin-left: 4px; letter-spacing: .08em; vertical-align: 3px; color: var(--ink-soft); }
#loading .big small { font-family: var(--font-ui); font-weight: 800; font-size: 18px; margin-left: 6px; color: var(--ink-soft); }
.modebar { display: flex; gap: 4px; padding: 4px; border-radius: 999px; pointer-events: auto; }
.modebar button { border: 0; background: transparent; border-radius: 999px; padding: 5px 11px; font-weight: 800; font-size: 12.5px; white-space: nowrap; }
.modebar button[aria-pressed=true] { background: var(--ink); color: var(--paper); }
.modebar .s { display: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 10px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; font-size: 12px; }
.legend i { width: 12px; height: 12px; border-radius: 4px; border: 2px solid var(--ink); flex: none; }
.chipline { background: rgba(255,253,247,.88); border: 2.5px solid var(--ink); border-radius: 999px; padding: 3px 11px; box-shadow: 0 3px 0 var(--shadow); pointer-events: auto; }
.chipline:empty { display: none; }
.modal .legend { flex-direction: column; gap: 6px; margin-bottom: 10px; }
.modal .legend span { font-size: 13px; align-items: flex-start; }
.modal .legend i { margin-top: 3px; }
.tag.kind { background: var(--k); color: var(--kt); }
.shop-body p b { font-size: 12px; color: var(--ink-soft); }
.shop-body .src { font-size: 12px; color: var(--ink-soft); }
.shop-body .src a { color: var(--leaf-deep); font-weight: 800; margin-right: 4px; }
.shop-actions { flex-wrap: wrap; }
.shop-thumb img[data-act] { cursor: zoom-in; }
.shop-item { border-left: 8px solid var(--k, var(--ink)); }
.photo-full { display: block; width: 100%; max-width: 100%; border-radius: 12px; border: 2.5px solid var(--ink); margin: 6px 0; }
.btn.post { background: var(--sun); }
.map-wrap.big .map-hint { display: none; }
.map-tools { position: absolute; left: 10px; right: 10px; top: 34px; display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
.map-tools .search { position: relative; flex: 1 1 200px; min-width: 0; }

.ri-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

@media (max-width: 640px) {

}

.sns-badge { position: relative; z-index: 1; font-weight: 800; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 999px; padding: 4px 12px; cursor: pointer; }

.sns-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.site-check { font-size: 12.5px; font-weight: 800; padding: 6px 10px; border-radius: 10px; background: #ffe3dc; margin-top: 6px; }
.site-check .mini { margin-left: 6px; padding: 3px 10px; border-radius: 999px; border: 2px solid #3b3427; background: #fff; font-weight: 800; cursor: pointer; }
.sns-check { font-size: 12.5px; font-weight: 800; padding: 6px 10px; border-radius: 10px; }
.sns-check.ok { background: #dff3e6; }
.sns-check.ng { background: #fde0da; }
.review-check { font-size: 12.5px; font-weight: 800; padding: 8px 10px; border-radius: 10px; background: #fde0da; line-height: 1.5; }
.post-form .count { align-self: flex-end; font-size: 11px; opacity: .6; }
.sns-box { padding: 10px; border-radius: 12px; background: color-mix(in srgb, var(--sky, #5fb6e8) 14%, transparent); }
.shop-body .review { white-space: pre-wrap; }
.dest-form { margin-bottom: 8px; }
.dest-row { display: flex; gap: 6px; }
.dest-row input { flex: 1; min-width: 0; }
.join-easy { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; margin: 4px 0 10px; border-radius: 12px; background: color-mix(in srgb, var(--sun, #ffd166) 35%, transparent); }
.join-easy b { font-size: 15px; }
.join-easy span { font-size: 12.5px; opacity: .8; }
.join-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.join-tabs button { flex: 1; }
.join-tabs button[aria-pressed="true"] { background: var(--ink, #3b3427); color: #fff; }
.rank-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 55vh; overflow: auto; }
.rank-list li { display: grid; grid-template-columns: 2.4em 1fr auto; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px; background: rgba(255,255,255,.7); font-weight: 700; }
.rank-list li.me { outline: 3px solid var(--sun, #ffd166); }
.rank-list .no { font-size: 18px; text-align: center; }
.rank-list .n { font-variant-numeric: tabular-nums; }
.my-posts { cursor: pointer; }
.post-form .how { display: flex; flex-direction: column; gap: 8px; }
.post-form .radio.big { border: 2.5px solid var(--ink); border-radius: 12px; padding: 8px 10px; background: #fff; }
.post-form .radio.big span { display: flex; flex-direction: column; }
.post-form .radio.big:has(input:checked) { background: #eaf3fd; }
.post-form .radio.big small { font-weight: 600; opacity: .8; }
.fb-mine { margin-top: 12px; font-size: 13px; }
.fb-mine summary { cursor: pointer; font-weight: 800; }
.fb-mine ul { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 30vh; overflow: auto; }
.fb-mine li { background: rgba(255,255,255,.75); border-radius: 10px; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; overflow-wrap: anywhere; }

.fb-tag { align-self: flex-start; font-size: 11px; font-weight: 800; padding: 1px 8px; border-radius: 999px; background: #ffe3dc; }
.fb-tag.idea { background: #fff3c4; }

/* ---------------- 案内人との会話（カメラが寄って、吹き出しの会話ウィンドウ） */
.talk-btn { background: #c9f0d4; }
.talk { position: fixed; inset: 0; z-index: 30; pointer-events: auto; cursor: pointer; }
.talk-bar { position: absolute; left: 0; right: 0; height: 9vh; background: #1d1a15; animation: barIn .45s ease-out both; }
.talk-bar.top { top: 0; transform-origin: top; }
.talk-bar.bottom { bottom: 0; transform-origin: bottom; }
@keyframes barIn { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.talk-box {
  position: absolute; left: 50%; bottom: calc(9vh + 18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  width: min(720px, calc(100vw - 28px)); min-height: 112px; box-sizing: border-box; padding: 26px 26px 22px;
  background: #fffaf0; border: 4px solid var(--ink); border-radius: 34px 34px 30px 30px / 30px 30px 34px 34px;
  box-shadow: 0 6px 0 rgba(0,0,0,.25); animation: boxIn .35s cubic-bezier(.2,1.4,.4,1) both .15s;
}
.talk-box::before {   /* 吹き出しのしっぽ（話している人のほうへ） */
  content: ""; position: absolute; top: -20px; left: 22%; width: 30px; height: 24px; background: #fffaf0;
  border-left: 4px solid var(--ink); border-top: 4px solid var(--ink); transform: skewX(-25deg) rotate(8deg); border-radius: 6px 0 0 0;
}
@keyframes boxIn { from { opacity: 0; transform: translate(-50%, 18px) scale(.94); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
.talk-name {
  position: absolute; top: -18px; left: 26px; background: #7bd389; color: #1d3b25; border: 3px solid var(--ink);
  border-radius: 999px; padding: 3px 16px; font-weight: 900; font-size: 15px; transform: rotate(-4deg); box-shadow: 0 3px 0 rgba(0,0,0,.2);
}
.talk-text { margin: 0; font-size: 18px; line-height: 1.7; font-weight: 700; white-space: pre-wrap; min-height: 3.4em; }
.talk-next { position: absolute; right: 26px; bottom: 12px; color: #ef8a3c; font-size: 16px; animation: nextBob .8s ease-in-out infinite; }
@keyframes nextBob { 50% { transform: translateY(4px); } }
.talk-choices {
  position: absolute; right: max(16px, calc(50% - 360px)); bottom: calc(9vh + 150px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 8px; align-items: stretch; min-width: 200px;
}
.talk-choices:empty { display: none; }
.talk-choices button {
  font: inherit; font-weight: 800; font-size: 16px; text-align: left; padding: 10px 20px 10px 34px; position: relative;
  background: #fffaf0; border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 3px 0 rgba(0,0,0,.2); cursor: pointer;
  animation: boxIn .25s ease-out both;
}
.talk-choices button:hover, .talk-choices button:focus-visible { background: #fff1c2; outline: none; }
.talk-choices button:hover::before, .talk-choices button:focus-visible::before { content: "▶"; position: absolute; left: 12px; color: #ef8a3c; }
body.talking .hud-tl, body.talking .hud-tr, body.talking .chatbar, body.talking .ride-btn, body.talking #shopCard,
body.talking #joystick, body.talking .ride-hud, body.talking #toast { opacity: 0; pointer-events: none !important; transition: opacity .3s; }
@media (max-width: 640px) {
  .talk-text { font-size: 15.5px; }
  .talk-box { padding: 22px 18px 18px; min-height: 100px; }
  .talk-choices { right: 14px; left: 14px; bottom: calc(9vh + 140px + env(safe-area-inset-bottom, 0px)); }
}

/* ---------------- 乗り物・ナビ・入室待ち */
.btn.help { background: #eaffc9; }
.ride-btn {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px));
  z-index: 6; background: var(--sun); font-size: 15px; min-height: 46px; padding: 0 20px; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis;
  animation: bob 1.6s ease-in-out infinite;
}
@keyframes bob { 50% { transform: translate(-50%, -4px); } }
.ride-btn:active { transform: translate(-50%, 2px); }
body:has(#rideBtn:not([hidden])) .talk-btn { bottom: calc(140px + env(safe-area-inset-bottom, 0px)); }
.ride-hud {
  position: fixed; left: 50%; transform: translateX(-50%); top: calc(12px + env(safe-area-inset-top, 0px));
  z-index: 8; display: flex; gap: 12px; align-items: center; padding: 8px 10px 8px 16px; max-width: calc(100vw - 24px);
}
.ride-text { display: flex; flex-direction: column; min-width: 0; }
.ride-text b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ride-text span { font-size: 12.5px; color: var(--ink-soft); font-weight: 700; }
.ride-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; margin-bottom: 10px; }
.ride-item { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; border: 2.5px solid var(--ink); border-radius: 12px; background: #fff; padding: 7px 10px; text-align: left; }
.ride-item small { color: var(--ink-soft); font-weight: 700; font-size: 11.5px; }
.ride-item:hover { background: #fff7d6; }
.ride-lines { margin-bottom: 10px; }
.ride-lines i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; border: 1.5px solid var(--ink); vertical-align: -1px; }
.guide {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px));
  width: min(620px, calc(100vw - 24px)); z-index: 15; display: grid; grid-template-columns: 84px 1fr; gap: 12px; padding: 12px 14px; align-items: start;
  background: linear-gradient(180deg, #fffef5, #f4fbe8);
}
#guideFace { width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(circle, #3d4a37, #26301f); border: 3px solid var(--ink); }
.guide-body { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.guide-head { display: flex; gap: 8px; align-items: baseline; padding-right: 36px; }
.guide-head b { font-family: var(--font-logo); font-weight: 400; font-size: 17px; color: var(--leaf-deep); }
.guide-head span { font-size: 12px; color: var(--ink-soft); font-weight: 700; }
.guide p { margin: 0; font-size: 15px; line-height: 1.7; min-height: 3.4em; font-weight: 700; }
.guide-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.guide-actions .btn { min-height: 38px; padding: 0 14px; }
.guide .close-x { top: 10px; right: 10px; }
.guide-topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.guide-topics button { border: 2.5px solid var(--ink); border-radius: 12px; background: #fff; padding: 8px 10px; font-weight: 800; text-align: left; }
.guide-topics button:hover { background: #eaffc9; }
.guide.menu p { min-height: 0; }
.navi-focus { position: relative; z-index: 14; animation: naviPulse 1.2s ease-in-out infinite; }
@keyframes naviPulse { 0%, 100% { box-shadow: 0 0 0 3px #b6f08a, 0 0 18px 6px rgba(182,240,138,.7); } 50% { box-shadow: 0 0 0 6px #b6f08a, 0 0 28px 12px rgba(182,240,138,.4); } }
#game.navi-focus { animation: none; }
.waiting { position: fixed; inset: 0; z-index: 35; display: grid; place-items: center; background: rgba(40,36,28,.45); padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.waiting-box { width: min(420px, 100%); padding: 20px; }
.waiting-box h2 { margin: 0 0 8px; font-family: var(--font-logo); font-weight: 400; }
.waiting-box p { margin: 0 0 8px; line-height: 1.7; }
.wait-mini { position: fixed; left: 50%; transform: translateX(-50%); top: calc(64px + env(safe-area-inset-top, 0px)); z-index: 9; background: var(--sun); }
@media (max-width: 640px) {
  .guide { grid-template-columns: 56px 1fr; gap: 8px; padding: 10px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  #guideFace { width: 56px; height: 56px; }
  .guide p { font-size: 14px; }
  .ride-btn { bottom: calc(150px + env(safe-area-inset-bottom, 0px)); font-size: 14px; }
  body:has(#rideBtn:not([hidden])) .talk-btn { bottom: calc(202px + env(safe-area-inset-bottom, 0px)); }
  .ride-hud { top: auto; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); width: calc(100vw - 24px); }
  .ride-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

<body>
<canvas id="game" tabindex="0" aria-label="町の画面"></canvas>
<div id="bubbles" aria-hidden="true"></div>

<div class="hud-tl">
  <div class="logo panel">まち<span>マニア</span><small>MAP</small></div>
  <div class="chips">
    <span class="chip" id="areaChip">読み込み中…</span>
    <span class="chip" id="netChip"><i class="dot"></i><span>接続中…</span></span>
    <button type="button" class="chip my-posts" id="myPosts">📝 投稿</button>
  </div>
  <div class="modebar panel" id="modeBar" role="group" aria-label="モード">
    <button type="button" data-mode="standard" aria-pressed="true"><span class="l">スタンダード</span><span class="s">すべて</span></button>
    <button type="button" data-mode="research" aria-pressed="false"><span class="l">新規出店収集</span><span class="s">新店</span></button>
    <button type="button" data-mode="community" aria-pressed="false"><span class="l">みんなでつくる</span><span class="s">みんな</span></button>
    <button type="button" data-mode="ranking" aria-pressed="false"><span class="l">投稿ランキング</span><span class="s">ランキング</span></button>
  </div>
  <div class="legend chipline" id="legend"></div>
  <section class="news panel" id="news" aria-label="新店のお知らせ" hidden>
    <button type="button" class="news-head" id="newsToggle" aria-expanded="true" aria-controls="newsList">
      <span>📣 新店のお知らせ</span><b class="news-badge" id="newsBadge" hidden></b><i class="chev" aria-hidden="true">▾</i>
    </button>
    <ol class="news-list" id="newsList"></ol>
  </section>
</div>

<div class="hud-tr">
  <div class="map-wrap panel" id="mapWrap">
    <canvas id="minimap" aria-label="全体マップ。クリックでその場所へ移動"></canvas>
    <span class="compass">北↑</span>
    <span class="map-hint">クリックでワープ</span>
    <button class="map-toggle" id="mapToggle" type="button">全国マップ</button>
    <div class="map-tools" id="mapTools" hidden>
      <div class="search"><input type="search" id="placeSearch" placeholder="駅名・市区町村・お店をさがす" aria-label="場所をさがす"><div class="results panel" id="placeResults" hidden></div></div>
      <div class="zoombtns">
        <button type="button" id="mapZoomIn" aria-label="拡大">＋</button>
        <button type="button" id="mapZoomOut" aria-label="縮小">－</button>
        <button type="button" id="mapHere">現在地</button>
        <button type="button" id="mapAll">日本全体</button>
      </div>
    </div>
  </div>
  <div class="tools">
    <button class="btn icon-btn post" id="btnPost" type="button" aria-label="お店を投稿">📷<small>投稿</small></button>
    <button class="btn icon-btn" id="btnShops" type="button" aria-label="お店リスト">🏪<small>お店</small></button>
    <button class="btn icon-btn" id="btnAvatar" type="button" aria-label="アバターを変える">🧑<small>すがた</small></button>
    <button class="btn icon-btn wide" id="btnAccount" type="button" aria-label="登録・ログイン">🔑<small>登録・<wbr>ログイン</small></button>
    <button class="btn icon-btn" id="btnFeedback" type="button" aria-label="ご意見をおくる（解消してほしい点・追加してほしい要素）">💡<small>ご意見</small></button>
    <button class="btn icon-btn help" id="btnHelp" type="button" aria-label="ナビにきく（ヘルプ）">？<small>ナビ</small></button>
  </div>
</div>

<div class="chatbar">
  <div class="chat-log panel" id="chatLog" hidden aria-live="polite"></div>
  <div class="stamps panel" id="stampPanel" hidden></div>
  <form class="chat-row panel" id="chatForm" autocomplete="off">
    <button class="btn icon-btn" type="button" id="btnLog" aria-label="チャット履歴" aria-expanded="false">💬</button>
    <button class="btn icon-btn" type="button" id="btnStamp" aria-label="スタンプ" aria-expanded="false">😊</button>
    <input id="chatInput" type="text" maxlength="100" placeholder="みんなに話しかける（Enter）" enterkeyhint="send" aria-label="チャット">
    <span class="count" id="chatCount">0/100</span>
    <button class="btn primary icon-btn" type="submit" aria-label="送信">➤</button>
  </form>
</div>

<div id="shopCard" class="shop-card panel" hidden></div>
<button id="rideBtn" class="btn ride-btn" type="button" hidden></button>
<button id="talkBtn" class="btn ride-btn talk-btn" type="button" hidden>💬 話しかける</button>

<div class="talk" id="talk" hidden role="dialog" aria-live="polite" aria-label="会話">
  <i class="talk-bar top" aria-hidden="true"></i><i class="talk-bar bottom" aria-hidden="true"></i>
  <div class="talk-choices" id="talkChoices"></div>
  <div class="talk-box">
    <span class="talk-name" id="talkName"></span>
    <p class="talk-text" id="talkText"></p>
    <span class="talk-next" id="talkNext" aria-hidden="true">▼</span>
  </div>
</div>
<div id="rideHud" class="ride-hud panel" hidden>
  <div class="ride-text"><b id="rideTitle"></b><span id="rideStatus"></span></div>
  <button class="btn sun" id="rideOff" type="button">次で降りる</button>
</div>
<div id="guide" class="guide panel" hidden role="dialog" aria-label="ナビの案内">
  <canvas id="guideFace" width="96" height="96" aria-hidden="true"></canvas>
  <div class="guide-body">
    <div class="guide-head"><b>ナビ</b><span id="guideTitle"></span></div>
    <p id="guideText" aria-live="polite"></p>
    <div class="guide-topics" id="guideTopics" hidden></div>
    <div class="guide-actions">
      <button class="btn" type="button" id="guideMenu">ほかのこと</button>
      <button class="btn" type="button" id="guideBack">もどる</button>
      <button class="btn primary" type="button" id="guideNext">つぎへ</button>
      <button class="close-x" type="button" id="guideClose" aria-label="ナビをとじる">✕</button>
    </div>
  </div>
</div>
<div id="waiting" class="waiting" hidden>
  <div class="panel waiting-box">
    <h2>入室待ち</h2>
    <p>いま町がいっぱいです。<span id="waitCount"></span></p>
    <p>だれかが帰ったら入れます。<b id="waitSec">30</b> 秒後にもう一度ためします。</p>
    <div class="row-end"><button class="btn" type="button" id="waitAlone">ひとりで歩きながら待つ</button></div>
  </div>
</div>
<button id="waitMini" class="chip wait-mini" type="button" hidden>入室待ち中…（タップで状況）</button>
<div id="joystick" hidden><div class="knob"></div></div>
<div id="toast" class="panel" hidden role="status"></div>
<div id="modalRoot"></div>

<div id="loading">
  <div class="box">
    <div class="big">まち<span>マニア</span><small>MAP</small></div>
    <div class="bar"><i id="loadBar"></i></div>
    <p id="loadText">地図を読み込んでいます</p>
